<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#102e35" />
  <meta name="description" content="Deus tem um milagre para você. Quinta-feira Portas Abertas em Birigui/SP: entre no grupo de WhatsApp e receba as informações do culto." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Quinta-feira Portas Abertas | Birigui" />
  <meta property="og:description" content="Deus tem um milagre para você. Participe do grupo de WhatsApp e saiba mais sobre Quinta-feira Portas Abertas em Birigui." />
  <title>Quinta-feira Portas Abertas | Birigui/SP</title>
  <style>
    :root { --navy: #102e35; --green: #1d544b; --cream: #faf7f0; --gold: #bb9160; --muted: #5e6c6b; --whatsapp: #1d9f61; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; color: var(--navy); background: var(--cream); }
    a { color: inherit; }
    .page { min-height: 100vh; overflow: hidden; }
    .wrap { width: min(1180px, calc(100% - 48px)); margin-inline: auto; }
    header { height: 90px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(16,46,53,.1); }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; font-size: 13px; text-transform: uppercase; letter-spacing: .17em; font-weight: 700; }
    .brand-mark { display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid var(--gold); border-radius: 50%; color: var(--gold); }
    .location { font-size: 12px; font-weight: 700; letter-spacing: .18em; color: var(--muted); }
    .landing-main { display:flex; align-items:center; justify-content:center; min-height:calc(100svh - 90px); padding-block:35px 70px; }
    .hero { width:min(100%, 780px); text-align:center; }
    .door-emblem { display:flex; align-items:center; justify-content:center; margin:0 auto 18px; width:124px; height:124px; filter:drop-shadow(0 8px 12px #bb916047); }
    h1 { font-family:Georgia,"Times New Roman",serif; font-weight:400; font-size:clamp(52px,7vw,90px); line-height:1.07; letter-spacing:-.055em; margin:0 auto 30px; max-width:760px; }
    h1 em { color:#aa8050; font-weight:400; font-style:normal; }
    /* CTA principal: movimento suave + anéis de pulsação. Sem piscadas agressivas. */
    .cta {
      position:relative; isolation:isolate; display:inline-flex; gap:12px;
      align-items:center; justify-content:center; border:0; border-radius:16px;
      background:var(--whatsapp); color:white; font-size:clamp(14px,2.7vw,18px);
      font-weight:750; line-height:1.3; text-align:center; text-decoration:none;
      padding:19px 23px; cursor:pointer; min-height:66px; max-width:100%;
      box-shadow:0 12px 26px #16845338;
      animation:cta-float 3.2s ease-in-out infinite;
      -webkit-tap-highlight-color:transparent;
      transition:background-color .2s ease;
    }
    .cta::before,.cta::after {
      content:""; position:absolute; inset:-3px; border-radius:19px;
      border:2px solid #1d9f6166; pointer-events:none; z-index:-1;
      animation:cta-ring 3.2s ease-out infinite;
    }
    .cta::after { animation-delay:1.6s; }
    .cta svg,.cta span { flex-shrink:0; }
    .cta:hover { background:#167e4e; animation-play-state:paused; }
    .cta:hover::before,.cta:hover::after { animation-play-state:paused; }
    .cta:active { background:#126f44; }
    .cta:focus-visible { outline:3px solid #bb9160; outline-offset:6px; }
    .help { margin:18px auto 0; font-size:14px; color:var(--muted); line-height:1.5; }
    @keyframes cta-float {
      0%,100% { transform:translateY(0) scale(1); box-shadow:0 12px 26px #16845338; }
      50% { transform:translateY(-7px) scale(1.025); box-shadow:0 21px 35px #16845359; }
    }
    @keyframes cta-ring {
      0% { opacity:0; transform:scale(.98); }
      16% { opacity:.6; }
      72%,100% { opacity:0; transform:scale(1.105); }
    }
    @media(max-width:800px) {
      .wrap { width:min(100% - 32px, 580px); }
      header { height:68px; }
      .brand { font-size:10px; letter-spacing:.11em; min-width:0; }
      .brand-mark { width:34px; height:34px; flex-shrink:0; }
      .location { font-size:10px; letter-spacing:.1em; white-space:nowrap; }
      .landing-main { min-height:calc(100svh - 68px); padding-block:16px 34px; }
      .door-emblem { width:98px; height:100px; margin-bottom:14px; }
      .door-emblem svg { width:92px; height:97px; }
      h1 { font-size:clamp(43px,11.4vw,70px); line-height:1.06; letter-spacing:-.047em; margin-bottom:28px; overflow-wrap:break-word; }
      .cta { width:100%; min-height:68px; padding:18px 13px; }
      .help { font-size:13px; }
    }
    @media(max-width:360px) {
      .wrap { width:calc(100% - 26px); }
      .brand { gap:7px; letter-spacing:.055em; }
      .location { letter-spacing:.02em; font-size:9px; }
      .landing-main { padding-block:12px 28px; }
      .door-emblem { width:80px; height:86px; margin-bottom:12px; }
      .door-emblem svg { width:80px; height:84px; }
      h1 { font-size:clamp(39px,11vw,48px); margin-bottom:25px; }
      .cta { gap:8px; padding:17px 8px; font-size:13px; }
      .cta svg { width:21px; height:21px; }
    }
    @media(max-height:650px) and (max-width:800px) {
      .landing-main { min-height:0; padding-block:22px 45px; }
      .door-emblem { height:78px; margin-bottom:8px; }
      .door-emblem svg { width:76px; height:80px; }
      h1 { margin-bottom:22px; }
    }
    @media(prefers-reduced-motion:reduce) {
      .cta,.cta::before,.cta::after { animation:none !important; transition:none; }
      .cta::before,.cta::after { display:none; }
      html { scroll-behavior:auto; }
    }
  </style>
</head>
<body>
<div class="page">
  <header class="wrap">
    <a class="brand" href="#" aria-label="Quinta-feira Portas Abertas, início">

  <main class="wrap landing-main">

        <svg viewBox="0 0 110 116" width="110" height="116" aria-hidden="true" focusable="false">

          <path d="M27 104 V48 A28 28 0 0 1 83 48 V104 Z" fill="url(#emblem-light)" stroke="#ae8550" stroke-width="3"/>

      </div>

      <a id="whatsapp-link" class="cta" href="https://chat.whatsapp.com/HSWVX3NZvmAIUO7ItGCipp" rel="noopener noreferrer" target="_blank">

          <path d="M20.1 11.6a8.1 8.1 0 0 1-11.7 7.3L4 20l1.2-4.2a8.1 8.1 0 1 1 14.9-4.2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M8.7 8.2c-.3-.5-.6-.4-.8-.4s-.5 0-.7.3c-.2.3-.9 1-.9 2.2 0 1.3.9 2.4 1 2.6 1.3 1.8 3 3.1 4.9 3.6 1.6.4 2.3.3 3.1.2.6-.2 1.6-1 1.8-1.8.2-.5.2-.7l-.6-1.5Z" fill="currentColor" transform="translate(1.1 0) scale(.85)"/>
        </svg>
        Entrar no grupo do WhatsApp
        <span aria-hidden="true">↗</span>
      </a>

    </section>
  </main>
</div>

</body>
</html>
